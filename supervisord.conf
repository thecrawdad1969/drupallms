[supervisord]
nodaemon=true

[program:apache]
command=/usr/sbin/apache2ctl -D FOREGROUND
autostart=true
autorestart=true

[program:sshd]
command=/usr/sbin/sshd -D
autostart=true
autorestart=true

[program:phpmyadmin]
# phpMyAdmin will be served by Apache under /phpmyadmin
# No separate process needed if using same Apache instance
command=/usr/bin/php /usr/share/phpmyadmin/phpmyadmin.php
directory=/usr/share/phpmyadmin
redirect_stderr=true
stderr_logfile=/var/log/phpmyadmin.err.log
stdout_logfile=/var/log/phpmyadmin.out.log

; Environment variables for DB connection
environment=PMADB_HOST="drupal-mysql-srv.mysql.database.azure.com",PMADB_USER="thecrawdad87",PMADB_PASSWORD="Dtag1984!"
autostart=true
autorestart=true