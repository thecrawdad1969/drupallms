trigger:
  - none

pool:
  vmImage: ubuntu-latest
stages:
  - stage: Build
    displayName: "Build Stage"
    jobs:
      - job: BuildApp
        displayName: "Compile and Build"
        steps:
          - task: DockerCompose@1
            inputs:
              containerregistrytype: 'Azure Container Registry'
              azureSubscription: 'ILCA_Test_Subscription(53e4cb02-4c86-4c00-b6df-931f66233826)'
              azureContainerRegistry: '{"loginServer":"ilcacontainers.azurecr.io", "id" : "/subscriptions/53e4cb02-4c86-4c00-b6df-931f66233826/resourceGroups/drupal-lms/providers/Microsoft.ContainerRegistry/registries/ILCAContainers"}'
              dockerComposeFile: '**/docker-compose.yml'
              action: 'Build services'
          - task: DockerCompose@1
            inputs:              
              containerregistrytype: 'Azure Container Registry'
              azureSubscription: 'ILCA_Test_Subscription(53e4cb02-4c86-4c00-b6df-931f66233826)'
              azureContainerRegistry: '{"loginServer":"ilcacontainers.azurecr.io", "id" : "/subscriptions/53e4cb02-4c86-4c00-b6df-931f66233826/resourceGroups/drupal-lms/providers/Microsoft.ContainerRegistry/registries/ILCAContainers"}'
              dockerComposeFile: '**/docker-compose.yml'
              action: 'Push services'